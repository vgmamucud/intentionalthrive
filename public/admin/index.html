<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intentional Thrive — Admin</title>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <script>
    CMS.init({
      config: {
        load_config_file: false,
        backend: {
          name: 'github',
          repo: 'vgmamucud/intentionalthrive',
          branch: 'main',
          base_url: 'https://intentionalthrive.com',
          auth_endpoint: '/api/auth',
        },
        media_folder: 'public/uploads',
        public_folder: '/uploads',
        collections: [
          {
            name: 'homepage',
            label: 'Homepage',
            files: [
              {
                label: 'Homepage Content',
                name: 'main',
                file: 'src/content/homepage/main.json',
                fields: [
                  {
                    label: 'SEO',
                    name: 'seo',
                    widget: 'object',
                    fields: [
                      { label: 'Page Title', name: 'title', widget: 'string' },
                      { label: 'Meta Description', name: 'description', widget: 'text' },
                    ],
                  },
                  {
                    label: 'Hero Slides',
                    name: 'heroSlides',
                    widget: 'list',
                    summary: '{{fields.quote}}',
                    fields: [
                      { label: 'Quote', name: 'quote', widget: 'string' },
                      { label: 'Tagline', name: 'tagline', widget: 'string' },
                      { label: 'Copy', name: 'copy', widget: 'text' },
                      { label: 'Button Label', name: 'cta', widget: 'string' },
                      { label: 'Button Link', name: 'href', widget: 'string' },
                      { label: 'Background Image Path', name: 'image', widget: 'string', hint: 'Example: /images/hero-understand.jpg' },
                      { label: 'Image Focal Point', name: 'focal', widget: 'string', default: '50% 50%' },
                      { label: 'Image Size', name: 'zoom', widget: 'string', default: 'cover' },
                      { label: 'Overlay Tint CSS', name: 'tint', widget: 'string' },
                    ],
                  },
                  {
                    label: 'Quick Links',
                    name: 'quickLinks',
                    widget: 'list',
                    summary: '{{fields.label}}',
                    fields: [
                      { label: 'Label', name: 'label', widget: 'string' },
                      { label: 'Tabler Icon Class', name: 'icon', widget: 'string', hint: 'Example: ti-heart-plus' },
                      { label: 'Link', name: 'href', widget: 'string' },
                    ],
                  },
                  {
                    label: 'Quick Links Aside',
                    name: 'quickAside',
                    widget: 'object',
                    fields: [
                      { label: 'Text', name: 'text', widget: 'string' },
                      { label: 'Button Label', name: 'cta', widget: 'string' },
                      { label: 'Button Link', name: 'href', widget: 'string' },
                    ],
                  },
                  { label: 'Help Section Title', name: 'helpTitle', widget: 'string' },
                  { label: 'Help Section Highlight', name: 'helpTitleAccent', widget: 'string' },
                  {
                    label: 'Help Tabs',
                    name: 'helpTabs',
                    widget: 'list',
                    summary: '{{fields.label}}',
                    fields: [
                      { label: 'ID', name: 'id', widget: 'string', hint: 'Use lowercase letters only, e.g. existing' },
                      { label: 'Tab Label', name: 'label', widget: 'string' },
                      {
                        label: 'Cards',
                        name: 'cards',
                        widget: 'list',
                        summary: '{{fields.title}}',
                        fields: [
                          { label: 'Title', name: 'title', widget: 'string' },
                          { label: 'Copy', name: 'copy', widget: 'text' },
                          { label: 'Link', name: 'href', widget: 'string' },
                        ],
                      },
                    ],
                  },
                  {
                    label: 'Proof Stats',
                    name: 'proofStats',
                    widget: 'list',
                    summary: '{{fields.value}}',
                    fields: [
                      { label: 'Value', name: 'value', widget: 'string' },
                      { label: 'Label', name: 'label', widget: 'string' },
                    ],
                  },
                  {
                    label: 'Pathways',
                    name: 'pathways',
                    widget: 'object',
                    fields: [
                      { label: 'Eyebrow', name: 'eyebrow', widget: 'string' },
                      { label: 'Heading', name: 'heading', widget: 'string' },
                      { label: 'Copy', name: 'copy', widget: 'text' },
                      {
                        label: 'Doors',
                        name: 'doors',
                        widget: 'list',
                        summary: '{{fields.label}}',
                        fields: [
                          { label: 'Label', name: 'label', widget: 'string' },
                          { label: 'Heading', name: 'heading', widget: 'string' },
                          { label: 'Copy', name: 'copy', widget: 'text' },
                          { label: 'Link', name: 'href', widget: 'string' },
                          { label: 'Link Label', name: 'linkLabel', widget: 'string' },
                        ],
                      },
                    ],
                  },
                  {
                    label: 'Core Journey',
                    name: 'journey',
                    widget: 'object',
                    fields: [
                      { label: 'Eyebrow', name: 'eyebrow', widget: 'string' },
                      { label: 'Heading', name: 'heading', widget: 'string' },
                      { label: 'Copy', name: 'copy', widget: 'text' },
                      {
                        label: 'Steps',
                        name: 'steps',
                        widget: 'list',
                        summary: '{{fields.label}}',
                        fields: [
                          { label: 'Step Label', name: 'label', widget: 'string' },
                          { label: 'Heading', name: 'heading', widget: 'string' },
                          { label: 'Copy', name: 'copy', widget: 'text' },
                        ],
                      },
                    ],
                  },
                  {
                    label: 'Decision Cards',
                    name: 'decisionCards',
                    widget: 'list',
                    summary: '{{fields.eyebrow}}',
                    fields: [
                      { label: 'Theme', name: 'theme', widget: 'select', options: ['primary', 'dark'] },
                      { label: 'Eyebrow', name: 'eyebrow', widget: 'string' },
                      { label: 'Heading', name: 'heading', widget: 'string' },
                      { label: 'Copy', name: 'copy', widget: 'text' },
                      { label: 'Button Label', name: 'cta', widget: 'string' },
                      { label: 'Button Link', name: 'href', widget: 'string' },
                    ],
                  },
                  {
                    label: 'Guide Section',
                    name: 'guide',
                    widget: 'object',
                    fields: [
                      { label: 'Eyebrow', name: 'eyebrow', widget: 'string' },
                      { label: 'Heading', name: 'heading', widget: 'string' },
                      { label: 'Paragraphs', name: 'paragraphs', widget: 'list', field: { label: 'Paragraph', name: 'paragraph', widget: 'text' } },
                      { label: 'Button Label', name: 'cta', widget: 'string' },
                      { label: 'Button Link', name: 'href', widget: 'string' },
                    ],
                  },
                  {
                    label: 'Article Strip',
                    name: 'articleStrip',
                    widget: 'object',
                    fields: [
                      { label: 'Eyebrow', name: 'eyebrow', widget: 'string' },
                      { label: 'Heading', name: 'heading', widget: 'string' },
                      { label: 'Copy', name: 'copy', widget: 'text' },
                      { label: 'Primary Button Label', name: 'primaryCta', widget: 'string' },
                      { label: 'Primary Button Link', name: 'primaryHref', widget: 'string' },
                      { label: 'Secondary Button Label', name: 'secondaryCta', widget: 'string' },
                      { label: 'Secondary Button Link', name: 'secondaryHref', widget: 'string' },
                    ],
                  },
                  {
                    label: 'Final CTA',
                    name: 'finalCta',
                    widget: 'object',
                    fields: [
                      { label: 'Eyebrow', name: 'eyebrow', widget: 'string' },
                      { label: 'Heading', name: 'heading', widget: 'string' },
                      { label: 'Button Label', name: 'cta', widget: 'string' },
                      { label: 'Button Link', name: 'href', widget: 'string' },
                    ],
                  },
                ],
              },
            ],
          },
          {
            name: 'articles',
            label: 'Articles',
            label_singular: 'Article',
            folder: 'src/content/articles',
            create: true,
            slug: '{{slug}}',
            extension: 'md',
            format: 'frontmatter',
            fields: [
              { label: 'Title', name: 'title', widget: 'string' },
              { label: 'Description', name: 'description', widget: 'text' },
              { label: 'Publish Date', name: 'pubDate', widget: 'string', default: 'June 2026' },
              { label: 'Pillar', name: 'pillar', widget: 'select',
                options: ['Money Mindset', 'Wealth in Practice', 'Intentional Living', 'The Journey'] },
              { label: 'Read Time', name: 'readTime', widget: 'string', default: '5 min' },
              { label: 'Draft', name: 'draft', widget: 'boolean', default: false },
              { label: 'Cover Image', name: 'heroImage', widget: 'image', required: false },
              { label: 'Body', name: 'body', widget: 'markdown' },
            ],
          },
          {
            name: 'shows',
            label: 'Shows',
            label_singular: 'Show',
            folder: 'src/content/shows',
            create: true,
            slug: '{{slug}}',
            extension: 'json',
            format: 'json',
            fields: [
              { label: 'Title', name: 'title', widget: 'string' },
              { label: 'Type', name: 'type', widget: 'select',
                options: [{ label: 'Podcast', value: 'podcast' }, { label: 'YouTube', value: 'youtube' }] },
              { label: 'Platform', name: 'platform', widget: 'string', hint: 'e.g. Spotify, Apple Podcasts, YouTube' },
              { label: 'URL', name: 'url', widget: 'string' },
              { label: 'Embed URL', name: 'embedUrl', widget: 'string', required: false },
              { label: 'Description', name: 'description', widget: 'text' },
              { label: 'Published', name: 'published', widget: 'boolean', default: true },
            ],
          },
          {
            name: 'resources',
            label: 'Resources',
            label_singular: 'Resource',
            folder: 'src/content/resources',
            create: true,
            slug: '{{slug}}',
            extension: 'json',
            format: 'json',
            fields: [
              { label: 'Title', name: 'title', widget: 'string' },
              { label: 'Description', name: 'description', widget: 'text' },
              { label: 'Category', name: 'category', widget: 'select',
                options: ['Financial Planning', 'Insurance Guides', 'Career in Finance', 'Templates & Tools'] },
              { label: 'File or Link URL', name: 'fileUrl', widget: 'string' },
              { label: 'Published', name: 'published', widget: 'boolean', default: true },
            ],
          },
        ],
      },
    });
  </script>
</body>
</html>
